name: Pre-alpha release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (created on the selected branch if it does not exist)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - id: ver
        shell: bash
        run: |
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag '$TAG' is not a valid version (expected e.g. v1.1.0-alpha.1)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if echo "$VERSION" | grep -q '-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Windows installer (${{ matrix.variant }})
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - variant: builtin
            features: ''
            prefix: Floe
          - variant: polars
            features: '--features polars-engine'
            prefix: Floe-polars
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.variant }}

      - name: Stamp version into app files
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: node .github/scripts/stamp-version.mjs

      - name: Install JS dependencies
        working-directory: desktop
        run: npm ci

      - name: Generate icons
        working-directory: desktop
        run: node scripts/ensure-icons.mjs

      - name: Build installer
        working-directory: desktop
        run: npx tauri build --bundles nsis ${{ matrix.features }}

      - name: Name installer by variant
        shell: bash
        working-directory: desktop/src-tauri/target/release/bundle/nsis
        run: |
          for f in Floe_*.exe; do
            new="${f/Floe_/${{ matrix.prefix }}_}"
            if [ "$new" != "$f" ]; then
              mv "$f" "$new"
            fi
          done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: floe-windows-${{ matrix.variant }}
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: staged
          pattern: floe-windows-*
          merge-multiple: true

      - name: Checksums
        run: |
          mkdir -p dist
          cp staged/*.exe dist/
          cd dist
          for f in *.exe; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -la

      - name: Write release notes
        run: |
          {
            if [ "$PRERELEASE" = "true" ]; then
              echo "**Pre-alpha — for testing only.** The Rust shell and the Polars engine were only recently compiled for the first time: expect bugs."
              echo
            fi
            echo "Windows installers:"
            echo "- \`Floe_${VERSION}_x64-setup.exe\` — built-in engine (recommended)."
            echo "- \`Floe-polars_${VERSION}_x64-setup.exe\` — adds the native Polars engine (about 30 MB larger)."
            echo
            echo "Builds are **not code-signed**, so Windows SmartScreen will show a warning. Choose *More info* then *Run anyway*. SHA-256 checksums are attached. There is no auto-update yet."
            echo
            echo "Floe runs entirely on your PC. Files are never uploaded."
          } > notes.md

      - name: Publish release
        run: |
          FLAGS=""
          if [ "$PRERELEASE" = "true" ]; then FLAGS="--prerelease"; fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "Floe $VERSION" \
              --notes-file notes.md \
              $FLAGS
          fi

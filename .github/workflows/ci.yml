name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build web and desktop frontends
        run: |
          node scripts/build-web.mjs --target web
          node scripts/build-web.mjs --target desktop

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run unit and end-to-end tests in headless Chromium
        run: |
          python -m http.server 8766 --bind 127.0.0.1 > /dev/null 2>&1 &
          sleep 2
          python .github/scripts/web_tests.py http://127.0.0.1:8766/tests.html
          python .github/scripts/web_tests.py http://127.0.0.1:8766/tests-ui.html

  engine:
    name: Polars engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Generate fixtures
        run: node scripts/gen-fixtures.mjs

      - name: Run engine tests
        run: cargo test --locked --manifest-path desktop/src-tauri/engine/Cargo.toml

  desktop:
    name: Windows installer (${{ matrix.variant }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: builtin
            features: ''
            prefix: Floe
          - variant: polars
            features: '--features polars-engine'
            prefix: Floe-polars
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.variant }}

      - name: Install JS dependencies
        run: npm ci

      - name: Generate icons
        run: node scripts/ensure-icons.mjs

      - name: Build installer
        run: npx tauri build --bundles nsis ${{ matrix.features }}

      - name: Name installer by variant
        shell: bash
        run: |
          cd src-tauri/target/release/bundle/nsis
          for f in Floe_*.exe; do
            new="${f/Floe_/${{ matrix.prefix }}_}"
            if [ "$new" != "$f" ]; then
              mv "$f" "$new"
            fi
          done
          ls -la

      - uses: actions/upload-artifact@v7
        with:
          name: floe-windows-${{ matrix.variant }}
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

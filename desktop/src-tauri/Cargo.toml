[package]
name = "floe"
version = "0.3.0"
description = "Floe — Polars desktop. Fast, git-friendly data preparation."
authors = ["Floe contributors"]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

# Standalone crate (not part of the engine workspace) so the desktop app always builds.
[workspace]

[lib]
# `_lib` suffix avoids a name clash with the bin on Windows (cargo#8519). Tauri 2 template layout.
name = "floe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
rmp-serde = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

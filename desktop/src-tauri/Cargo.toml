[workspace]
members = [".", "engine"]

[package]
name = "floe"
version = "1.1.0"
description = "Floe — data preparation on your desktop"
authors = ["Floe"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "floe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

floe-engine = { path = "engine", optional = true }

[features]
default = []
polars-engine = ["dep:floe-engine"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

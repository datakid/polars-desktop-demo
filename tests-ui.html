<!DOCTYPE html><html><head><meta charset="UTF-8"><style>html,body{margin:0;height:100%}iframe{border:0;width:100%;height:100%}</style></head><body>
<iframe id="f" src="index.html?demo"></iframe>
<script>
const f = document.getElementById('f');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms) { const t0 = Date.now(); while (Date.now() - t0 < (ms || 20000)) { try { const v = fn(); if (v) return v; } catch (e) { } await sleep(150); } throw new Error('timeout'); }
f.addEventListener('load', async () => {
  const w = f.contentWindow, UI = () => w.PQ.UI;
  try {
    await until(() => UI().App.result && UI().App.result.fp);
    console.log('E2E fp ok', UI().App.result.n);
    const chip = w.document.getElementById('engine-chip');
    await until(() => /Built-in/.test(chip.querySelector('.engine-name').textContent) && /ms|s ·/.test(chip.querySelector('.engine-meta').textContent));
    console.log('E2E chip', chip.querySelector('.engine-name').textContent, '|', chip.querySelector('.engine-meta').textContent, '| aria:', chip.getAttribute('aria-label'));
    chip.click();
    await until(() => w.document.querySelector('.engine-kv'));
    console.log('E2E engine dialog', /Last run/.test(w.document.querySelector('.engine-kv').textContent) ? 'has Last run' : 'MISSING');
    w.document.querySelector('.modal .close').click();
    await UI().App.runFull();
    await until(() => /Full/.test(chip.querySelector('.engine-meta').textContent), 30000);
    console.log('E2E chip full', chip.querySelector('.engine-meta').textContent);
    UI().App.setMode('preview');
    await until(() => /Sample|All rows/.test(chip.querySelector('.engine-meta').textContent), 30000);
    UI().palette();
    const inp = w.document.querySelector('.palette-input');
    inp.value = 'clus'; inp.dispatchEvent(new w.Event('input'));
    console.log('E2E palette top', w.document.querySelector('.palette-i.on').textContent);
    inp.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape' }));
    UI().Store.setUI({ rightTab: 'overview' }); UI().App.renderRight();
    await until(() => w.document.querySelector('.ov-ring'));
    console.log('E2E overview score', w.document.querySelector('.ov-ring').textContent, 'cols', w.document.querySelectorAll('.ov-cols li').length);
    UI().App.stepDialog('ClusterValues', { col: 'status', method: 'fingerprint', pairs: [] });
    await until(() => w.document.querySelector('.cluster') || w.document.querySelector('.cluster-list .callout'));
    console.log('E2E clusters', w.document.querySelectorAll('.cluster').length);
    w.document.querySelector('.modal .btn.primary').click();
    await sleep(1500);
    const q = UI().Store.query();
    console.log('E2E last step', q.steps[q.steps.length - 1].kind.type);
    UI().App.stepDialog('Validate', { rules: [{ col: 'unit_price', check: 'range', arg: '0', arg2: '50' }], action: 'flag', name: 'Issues' });
    await until(() => w.document.querySelector('.live-preview .mini-table'));
    console.log('E2E validate preview', w.document.querySelector('.lp-h').textContent);
    w.document.querySelector('.modal .btn.primary').click();
    await until(() => UI().App.result && UI().App.result.schema.some((c) => c.name === 'Issues'));
    const r = await UI().Engine.call('exportQuery', { qid: UI().Store.ui.activeQid, format: 'parquet' });
    console.log('E2E parquet export rows', r.rows, 'bytes', r.data.byteLength);
    const doc = w.document;
    const nativeSel = 'select, option, datalist, details, dialog, progress, meter, input[type=number], input[type=range], input[type=date], input[type=color], input[type=time], [title]';
    const closeAll = async () => { doc.querySelectorAll('.modal .close').forEach((b) => b.click()); await sleep(250); };
    const cases = Object.keys(UI().StepForms).map((t) => [t, {}]);
    let nativeCount = 0, selects = 0, steppers = 0;
    for (const [type, init] of cases) {
      UI().App.stepDialog(type, init);
      await until(() => doc.querySelector('.modal'));
      await sleep(400);
      nativeCount += doc.querySelectorAll(nativeSel).length;
      selects += doc.querySelectorAll('.modal .select').length;
      steppers += doc.querySelectorAll('.modal .stepper').length;
      doc.querySelectorAll('.modal .select').forEach((x) => { if (x.localName !== 'button') nativeCount++; });
      doc.querySelectorAll('.modal input[type=checkbox]').forEach((c) => { if (w.getComputedStyle(c).appearance !== 'none') nativeCount++; });
      doc.querySelectorAll('.modal textarea').forEach((t) => { if (w.getComputedStyle(t).resize !== 'none') nativeCount++; });
      await closeAll();
    }
    nativeCount += doc.querySelectorAll(nativeSel).length;
    console.log('E2E native controls', nativeCount, 'custom selects', selects, 'steppers', steppers);
    if (nativeCount || !selects || !steppers) throw new Error('native control audit failed');
    UI().App.stepDialog('Sample', { mode: 'n', n: 1000, seed: 42 });
    await until(() => doc.querySelector('.modal .select'));
    const modeSel = doc.querySelector('.modal .select');
    let fired = 0;
    modeSel.addEventListener('change', () => fired++);
    modeSel.click();
    await until(() => doc.querySelector('.dd'));
    const opts = doc.querySelectorAll('.dd-i').length;
    doc.querySelectorAll('.dd-i')[1].click();
    await sleep(200);
    console.log('E2E select', 'options', opts, 'value', modeSel.value, 'change events', fired, 'list closed', !doc.querySelector('.dd'));
    if (modeSel.value !== 'percent' || fired !== 1 || doc.querySelector('.dd')) throw new Error('select behaviour failed');
    const step = doc.querySelector('.modal .stepper');
    const stepInput = step.querySelector('input');
    stepInput.value = '12abc';
    stepInput.dispatchEvent(new w.Event('input', { bubbles: true }));
    console.log('E2E stepper sanitised', step.value);
    if (step.value !== '12') throw new Error('stepper sanitising failed');
    await closeAll();
    const tipBtn = doc.getElementById('btn-undo');
    console.log('E2E tooltip source', tipBtn.hasAttribute('title') ? 'native title present' : tipBtn.getAttribute('data-tip'));
    if (tipBtn.hasAttribute('title') || !tipBtn.getAttribute('data-tip')) throw new Error('tooltip migration failed');
    UI().Store.setUI({ rightTab: 'steps' });
    UI().App.renderRight();
    await sleep(400);
    const names = () => [...doc.querySelectorAll('#step-list .s-name')].map((e) => e.textContent);
    const before = names();
    const fire = (type, target, x, y) => target.dispatchEvent(new w.PointerEvent(type, { bubbles: true, cancelable: true, button: 0, pointerType: 'mouse', clientX: x, clientY: y }));
    const items = () => [...doc.querySelectorAll('#step-list li.step')];
    const from = items()[2].getBoundingClientRect(), to = items()[5].getBoundingClientRect();
    fire('pointerdown', items()[2], from.left + 60, from.top + 10);
    fire('pointermove', doc, from.left + 60, from.top + 30);
    fire('pointermove', doc, from.left + 60, to.top + to.height * 0.8);
    const ghost = doc.querySelectorAll('.step-ghost').length;
    fire('pointerup', doc, from.left + 60, to.top + to.height * 0.8);
    await sleep(600);
    const moved = names();
    const expected = before.slice(); expected.splice(5, 0, expected.splice(2, 1)[0]);
    console.log('E2E reorder ghost', ghost, 'moved', JSON.stringify(moved) === JSON.stringify(expected), 'draggable', doc.querySelectorAll('[draggable=true]').length, 'ghost cleaned', !doc.querySelector('.step-ghost'));
    if (!ghost || JSON.stringify(moved) !== JSON.stringify(expected) || doc.querySelector('[draggable=true]') || doc.querySelector('.step-ghost')) throw new Error('step reorder failed ');
    UI().Store.undoOne();
    await sleep(600);
    if (JSON.stringify(names()) !== JSON.stringify(before)) throw new Error('undo after reorder failed');
    await sleep(800);
    const inject = (src) => new Promise((res, rej) => { const el = w.document.createElement('script'); el.src = src; el.onload = res; el.onerror = () => rej(new Error(src + ' failed to load')); w.document.head.appendChild(el); });
    const saved = { native: UI().NativeEngine, worker: UI().Engine.callWorker, files: UI().App.files, project: UI().Engine.lastProject };
    const stubCalls = [];
    let stubHang = false;
    w.__TAURI__ = { core: { invoke: async (cmd, a) => {
      stubCalls.push(cmd);
      if (cmd === 'engine_cancel') return undefined;
      if (cmd === 'engine_call' && a.op === 'explain') return { text: 'SCAN [/data/orders.csv]\nPROJECT */8 COLUMNS' };
      if (cmd === 'engine_call' && stubHang) return new Promise(() => { });
      if (cmd === 'engine_call') return { resultId: 'pl_stub', n: 3, schema: [{ name: 'a', type: 'int' }, { name: 'big', type: 'int' }], quality: [], ms: 1, truncated: false };
      if (cmd === 'engine_page') return w.Arrow.tableToIPC(w.Arrow.tableFromArrays({ a: w.Int32Array.from([1, 2, 3]), big: w.BigInt64Array.from([9007199254740993n, 5n, -9007199254740993n]) }), 'stream');
      throw new Error('unexpected command ' + cmd);
    } } };
    try {
      if (!w.Arrow) await inject('vendor/arrow.es2015.min.js');
      if (!w.PQ.Plan) await inject('js/plan.js');
      await inject('js/native-engine.js');
      const N = UI().NativeEngine;
      N.ready = true; N.disabled = false; N.info = { polars: 'stub', version: '0' };
      const project = { settings: { previewRows: 1000, locale: 'en-US' }, params: [], queries: [{ id: 'q1', name: 'Orders', steps: [{ id: 's0', name: 'Source', kind: { type: 'Source', source: { kind: 'file', fileId: 'f1', fileName: 'orders.csv', csv: { delimiter: ',' } } } }] }] };
      UI().App.files = [{ id: 'f1', path: '/data/orders.csv' }];
      UI().Engine.lastProject = project;
      let workerCalls = 0;
      UI().Engine.callWorker = () => { workerCalls++; return new Promise(() => { }); };
      const msg = { qid: 'q1', upto: 0, mode: 'preview' };
      if (!N.shouldRun('evaluate', msg, project)) throw new Error('stub plan was not lowered: ' + UI().Engine.nativeReason);
      const out = await Promise.race([N.call('evaluate', msg), sleep(3000).then(() => 'TIMEOUT')]);
      if (out === 'TIMEOUT') throw new Error('Polars evaluate waited for the built-in worker');
      if (workerCalls !== 0) throw new Error('built-in worker ran during Polars evaluate: ' + workerCalls);
      if (out.resultId !== 'pl_stub' || out.n !== 3 || !out.firstPage || out.firstPage.length !== 3) throw new Error('unexpected Polars result ' + JSON.stringify(out).slice(0, 200));
      const bigCells = out.firstPage.map((r) => r[1]);
      if (JSON.stringify(bigCells) !== JSON.stringify(['9007199254740993', 5, '-9007199254740993'])) throw new Error('int64 cells were not kept exact: ' + JSON.stringify(bigCells));
      console.log('E2E int64 cells', JSON.stringify(bigCells));
      const explained = await N.explain('q1', 0);
      if (!explained.text || !explained.text.startsWith('SCAN')) throw new Error('explain did not return the plan: ' + JSON.stringify(explained));
      out.derive(); out.derive();
      if (workerCalls !== 1) throw new Error('derive must start exactly one worker evaluate, got ' + workerCalls);
      console.log('E2E polars evaluate does not block on the worker; worker calls', workerCalls, 'native commands', stubCalls.join(','));
      const collect = w.gc || self.gc;
      if (!collect) throw new Error('garbage collection is not exposed; run the browser with --js-flags=--expose-gc');
      let ref;
      (() => { const abandoned = { qid: 'q1', upto: 0, mode: 'preview' }; N.shouldRun('evaluate', abandoned, project); ref = new w.WeakRef(abandoned); })();
      for (let i = 0; i < 40 && ref.deref(); i++) { await sleep(50); collect(); }
      if (ref.deref()) throw new Error('an abandoned evaluate request is still held by the native engine');
      console.log('E2E abandoned native request released');
      stubHang = true;
      const callsBefore = workerCalls;
      const hungMsg = { qid: 'q1', upto: 0, mode: 'preview' };
      N.shouldRun('evaluate', hungMsg, project);
      const hung = N.call('evaluate', hungMsg).then(() => 'RESOLVED', (e) => e);
      await sleep(100);
      N.cancel();
      const settled = await Promise.race([hung, sleep(2000).then(() => 'TIMEOUT')]);
      if (settled === 'TIMEOUT') throw new Error('cancel did not release the pending Polars evaluate');
      if (settled === 'RESOLVED' || !settled.cancelled) throw new Error('cancelled evaluate must reject with a cancelled error: ' + (settled && settled.message));
      if (workerCalls !== callsBefore) throw new Error('cancelled evaluate fell back to the built-in worker');
      console.log('E2E cancel releases a running Polars evaluate without falling back');
    } finally {
      UI().NativeEngine = saved.native; UI().Engine.callWorker = saved.worker; UI().App.files = saved.files; UI().Engine.lastProject = saved.project;
      delete w.__TAURI__;
    }
    const ordersId = UI().Store.project.queries.find((x) => x.name === 'Orders').id;
    const mergeOpen = async (o) => {
      UI().mergeDialog(o);
      await until(() => doc.querySelectorAll('.modal .mini-table').length === 2 && doc.querySelector('.modal .callout'));
      await sleep(250);
    };
    const mergeFits = (label) => {
      const mb = doc.querySelector('.modal .modal-b');
      if (mb.scrollWidth > mb.clientWidth + 1) throw new Error('merge dialog scrolls sideways ' + label + ': ' + mb.scrollWidth + ' > ' + mb.clientWidth);
      const mr = doc.querySelector('.modal').getBoundingClientRect();
      const panes = [...doc.querySelectorAll('.modal .grid-2 > div')].map((x) => x.getBoundingClientRect());
      if (panes.some((r) => r.left < mr.left - 0.5 || r.right > mr.right + 0.5)) throw new Error('merge dialog pane leaves the dialog ' + label);
      const heads = [...doc.querySelectorAll('.modal .pane-head .field-label')];
      if (heads.length !== 2 || heads.some((x) => x.getBoundingClientRect().width < 60 || x.scrollWidth > x.clientWidth + 1)) throw new Error('merge dialog pane titles are squeezed ' + label);
    };
    await mergeOpen({ qid: ordersId, insertAt: 2, kind: { type: 'Merge' } });
    mergeFits('on the desktop layout');
    console.log('E2E merge dialog fits the desktop layout');
    doc.querySelector('.modal .close').click();
    await sleep(250);
    const panes = () => [...doc.querySelectorAll('.modal .grid-2 > div')];
    const keyBadges = (i) => [...panes()[i].querySelectorAll('th.key')].map((x) => x.querySelector('b').textContent + x.lastChild.textContent);
    const clickTh = (i, name) => { const th = [...panes()[i].querySelectorAll('th')].find((x) => x.lastChild.textContent === name); if (!th) throw new Error('no column ' + name + ' in pane ' + i); th.click(); };
    const mergeOk = async () => { [...doc.querySelectorAll('.modal .btn.primary')].pop().click(); await sleep(900); };
    const mergeClose = async () => { doc.querySelectorAll('.modal .close').forEach((b) => b.click()); await sleep(250); };
    const choose = async (idx, label) => {
      doc.querySelectorAll('.modal .select')[idx].click();
      await until(() => doc.querySelector('.dd'));
      [...doc.querySelectorAll('.dd-i')].find((x) => x.textContent.includes(label)).click();
      await sleep(700);
    };
    const mergeKind = () => UI().Store.query(ordersId).steps[6].kind;
    const origMerge = JSON.parse(JSON.stringify(mergeKind()));
    const restoreMerge = () => { UI().Store.edit('restore merge', (pr) => { pr.queries.find((x) => x.id === ordersId).steps[6].kind = JSON.parse(JSON.stringify(origMerge)); }); return sleep(500); };
    await mergeOpen({ qid: ordersId, insertAt: 2, kind: { type: 'Merge' } });
    clickTh(0, 'customer_id'); await sleep(150);
    clickTh(1, 'region'); await sleep(150);
    clickTh(0, 'status'); await sleep(150);
    if (JSON.stringify(keyBadges(0)) !== '["①status"]' || JSON.stringify(keyBadges(1)) !== '["①region"]') throw new Error('right key then left key did not form one pair: ' + JSON.stringify([keyBadges(0), keyBadges(1)]));
    clickTh(1, 'region'); await sleep(150);
    clickTh(0, 'status'); await sleep(150);
    clickTh(0, 'order_id'); await sleep(150);
    clickTh(1, 'segment'); await sleep(150);
    if (JSON.stringify(keyBadges(0)) !== '["①order_id"]' || JSON.stringify(keyBadges(1)) !== '["①segment"]') throw new Error('left key then right key did not form one pair: ' + JSON.stringify([keyBadges(0), keyBadges(1)]));
    console.log('E2E merge keys pair up in either click order');
    await mergeClose();
    await mergeOpen({ qid: ordersId, insertAt: 2, kind: { type: 'Merge' } });
    await choose(0, 'Revenue by Region');
    if (keyBadges(0).length || keyBadges(1).length) throw new Error('switching the second table kept a key that it does not have: ' + JSON.stringify([keyBadges(0), keyBadges(1)]));
    const stepsBefore = UI().Store.query(ordersId).steps.length;
    [...doc.querySelectorAll('.modal .btn.primary')].pop().click();
    await sleep(600);
    if (!doc.querySelector('.modal') || UI().Store.query(ordersId).steps.length !== stepsBefore) throw new Error('a merge with no valid keys was added');
    console.log('E2E merge drops keys the new second table does not have');
    await mergeClose();
    await mergeOpen({ qid: ordersId, index: 6 });
    await mergeOk();
    if (JSON.stringify(mergeKind().expand) !== JSON.stringify(origMerge.expand)) throw new Error('editing a merge changed its columns: ' + JSON.stringify(mergeKind().expand));
    console.log('E2E editing a merge keeps its chosen columns', JSON.stringify(mergeKind().expand));
    await mergeOpen({ qid: ordersId, index: 6 });
    clickTh(1, 'region'); await sleep(150);
    clickTh(0, 'status'); await sleep(150);
    await mergeOk();
    if (mergeKind().on.length !== 2 || mergeKind().expand.includes('region') || mergeKind().expand.includes('customer_id')) throw new Error('a key column was also brought in as a value: ' + JSON.stringify(mergeKind()));
    console.log('E2E merge keys are not brought in as columns', JSON.stringify(mergeKind().expand));
    await restoreMerge();
    await mergeOpen({ qid: ordersId, index: 6 });
    await choose(1, 'Left semi');
    await mergeOk();
    if (mergeKind().how !== 'semi') throw new Error('semi join was not saved');
    await mergeOpen({ qid: ordersId, index: 6 });
    await choose(1, 'Left outer');
    await mergeOk();
    if (mergeKind().how !== 'left' || mergeKind().expand.length !== 4) throw new Error('switching a semi join back to a left join lost its columns: ' + JSON.stringify(mergeKind()));
    console.log('E2E semi join edited back to left brings in every column');
    await mergeOpen({ qid: ordersId, index: 6 });
    [...doc.querySelectorAll('.modal button')].find((x) => x.textContent.trim() === 'Clear').click();
    await sleep(200);
    await mergeOk();
    if (JSON.stringify(mergeKind().expand) !== '[]') throw new Error('clearing the columns was not saved: ' + JSON.stringify(mergeKind().expand));
    await mergeOpen({ qid: ordersId, index: 6 });
    await mergeOk();
    if (JSON.stringify(mergeKind().expand) !== '[]') throw new Error('a cleared column list came back after editing: ' + JSON.stringify(mergeKind().expand));
    console.log('E2E a merge with no columns stays that way');
    await restoreMerge();
    const frame = document.getElementById('f');
    const pageErrors = [];
    w.addEventListener('error', (e) => pageErrors.push(e.message));
    w.addEventListener('unhandledrejection', (e) => pageErrors.push(String(e.reason)));
    const settle = async (doc) => {
      const root = doc.querySelector('.modal-back') || doc.body;
      await Promise.all(root.getAnimations({ subtree: true }).filter((an) => an.effect && isFinite(an.effect.getComputedTiming().endTime)).map((an) => an.finished.catch(() => null)));
    };
    const probe = async (width, height) => {
      frame.style.width = width + 'px'; frame.style.height = height + 'px';
      await sleep(500);
      const doc = w.document;
      const over = doc.documentElement.scrollWidth - width;
      if (over > 0) throw new Error('the page is ' + over + 'px wider than a ' + width + 'px screen');
      const tabs = doc.querySelector('#pane-tabs').getBoundingClientRect();
      if (tabs.right > width + 0.5) throw new Error('the pane tabs end at ' + Math.round(tabs.right) + ' on a ' + width + 'px screen');
      for (const open of ['paramsDialog', 'cliDialog']) {
        UI()[open](); await sleep(300); await settle(doc);
        const foot = doc.querySelector('.modal .modal-f').getBoundingClientRect();
        if (foot.bottom > height + 0.5 || foot.top < 0) throw new Error(open + ' footer spans ' + Math.round(foot.top) + '-' + Math.round(foot.bottom) + ' on a ' + height + 'px screen');
        doc.querySelector('.modal .close').click(); await sleep(250);
      }
      await mergeOpen({ qid: ordersId, insertAt: 2, kind: { type: 'Merge' } });
      mergeFits('on a ' + width + 'px screen');
      doc.querySelector('.modal .close').click(); await sleep(250);
      await mergeOpen({ qid: ordersId, index: 6 });
      mergeFits('while editing on a ' + width + 'px screen');
      doc.querySelector('.modal .close').click(); await sleep(250);
      const forms = Object.keys(UI().StepForms);
      for (const type of forms) {
        pageErrors.length = 0;
        UI().App.stepDialog(type, {}); await sleep(200); await settle(doc);
        const modal = doc.querySelector('.modal');
        const where = ' on a ' + width + 'x' + height + ' screen';
        if (!modal) throw new Error('the ' + type + ' dialog did not open' + where);
        const body = modal.querySelector('.modal-body') || modal;
        if (body.scrollWidth > body.clientWidth + 1) throw new Error('the ' + type + ' dialog scrolls sideways' + where);
        for (const btn of modal.querySelectorAll('.modal-f button')) {
          const r = btn.getBoundingClientRect();
          if (r.bottom > height + 0.5 || r.right > width + 0.5 || r.left < -0.5 || r.top < -0.5) throw new Error('a button of the ' + type + ' dialog is off screen' + where + ': ' + btn.textContent.trim());
        }
        if (doc.documentElement.scrollWidth > width) throw new Error('the ' + type + ' dialog makes the page wider than the screen' + where);
        if (pageErrors.length) throw new Error('the ' + type + ' dialog raised an error' + where + ': ' + pageErrors[0]);
        modal.querySelector('.close').click(); await sleep(100);
        if (doc.querySelector('.modal')) throw new Error('the ' + type + ' dialog did not close' + where);
      }
      console.log('E2E ' + forms.length + ' step dialogs fit ' + width + 'x' + height);
      console.log('E2E phone ' + width + 'x' + height + ' fits, scrollWidth ' + doc.documentElement.scrollWidth);
    };
    try { await probe(1280, 800); await probe(390, 844); await probe(360, 640); } finally { frame.style.width = ''; frame.style.height = ''; }
    console.log('E2E DONE');
  } catch (e) { console.log('E2E FAIL', e.message, e.stack); }
});
</script></body></html>

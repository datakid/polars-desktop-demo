<!DOCTYPE html><html><head><meta charset="UTF-8"><style>html,body{margin:0;height:100%}iframe{border:0;width:100%;height:100%}</style></head><body>
<iframe id="f" src="index.html?demo"></iframe>
<script>
const f = document.getElementById('f');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms) { const t0 = Date.now(); while (Date.now() - t0 < (ms || 20000)) { try { const v = fn(); if (v) return v; } catch (e) { } await sleep(150); } throw new Error('timeout'); }
f.addEventListener('load', async () => {
  const w = f.contentWindow, UI = () => w.PQ.UI;
  try {
    await until(() => UI().App.result && UI().App.result.fp);
    console.log('E2E fp ok', UI().App.result.n);
    const chip = w.document.getElementById('engine-chip');
    await until(() => /Built-in/.test(chip.querySelector('.engine-name').textContent) && /ms|s ·/.test(chip.querySelector('.engine-meta').textContent));
    console.log('E2E chip', chip.querySelector('.engine-name').textContent, '|', chip.querySelector('.engine-meta').textContent, '| aria:', chip.getAttribute('aria-label'));
    chip.click();
    await until(() => w.document.querySelector('.engine-kv'));
    console.log('E2E engine dialog', /Last run/.test(w.document.querySelector('.engine-kv').textContent) ? 'has Last run' : 'MISSING');
    w.document.querySelector('.modal .close').click();
    await UI().App.runFull();
    await until(() => /Full/.test(chip.querySelector('.engine-meta').textContent), 30000);
    console.log('E2E chip full', chip.querySelector('.engine-meta').textContent);
    UI().App.setMode('preview');
    await until(() => /Sample|All rows/.test(chip.querySelector('.engine-meta').textContent), 30000);
    UI().palette();
    const inp = w.document.querySelector('.palette-input');
    inp.value = 'clus'; inp.dispatchEvent(new w.Event('input'));
    console.log('E2E palette top', w.document.querySelector('.palette-i.on').textContent);
    inp.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape' }));
    UI().Store.setUI({ rightTab: 'overview' }); UI().App.renderRight();
    await until(() => w.document.querySelector('.ov-ring'));
    console.log('E2E overview score', w.document.querySelector('.ov-ring').textContent, 'cols', w.document.querySelectorAll('.ov-cols li').length);
    UI().App.stepDialog('ClusterValues', { col: 'status', method: 'fingerprint', pairs: [] });
    await until(() => w.document.querySelector('.cluster') || w.document.querySelector('.cluster-list .callout'));
    console.log('E2E clusters', w.document.querySelectorAll('.cluster').length);
    w.document.querySelector('.modal .btn.primary').click();
    await sleep(1500);
    const q = UI().Store.query();
    console.log('E2E last step', q.steps[q.steps.length - 1].kind.type);
    UI().App.stepDialog('Validate', { rules: [{ col: 'unit_price', check: 'range', arg: '0', arg2: '50' }], action: 'flag', name: 'Issues' });
    await until(() => w.document.querySelector('.live-preview .mini-table'));
    console.log('E2E validate preview', w.document.querySelector('.lp-h').textContent);
    w.document.querySelector('.modal .btn.primary').click();
    await until(() => UI().App.result && UI().App.result.schema.some((c) => c.name === 'Issues'));
    const r = await UI().Engine.call('exportQuery', { qid: UI().Store.ui.activeQid, format: 'parquet' });
    console.log('E2E parquet export rows', r.rows, 'bytes', r.data.byteLength);
    const doc = w.document;
    const nativeSel = 'select, option, datalist, details, dialog, progress, meter, input[type=number], input[type=range], input[type=date], input[type=color], input[type=time], [title]';
    const closeAll = async () => { doc.querySelectorAll('.modal .close').forEach((b) => b.click()); await sleep(250); };
    const cases = [
      ['Sample', { mode: 'n', n: 1000, seed: 42 }],
      ['Filter', { mode: 'builder', builder: { join: 'and', conds: [{ col: 'status', op: 'eq', value: '' }] } }],
      ['Sort', { by: [{ col: 'revenue', desc: true }] }],
      ['GroupBy', { keys: ['region'], aggs: [{ fn: 'sum', col: 'revenue', name: 'revenue' }] }],
      ['KeepRows', { mode: 'top', n: 100 }],
      ['ChangeType', { changes: [{ col: 'quantity', type: 'int' }], onError: 'error' }],
      ['Validate', { rules: [{ col: 'status', check: 'regex' }], action: 'flag', name: 'Issues' }],
      ['AddColumn', { formula: '' }],
    ];
    let nativeCount = 0, selects = 0, steppers = 0;
    for (const [type, init] of cases) {
      UI().App.stepDialog(type, init);
      await until(() => doc.querySelector('.modal'));
      await sleep(400);
      nativeCount += doc.querySelectorAll(nativeSel).length;
      selects += doc.querySelectorAll('.modal .select').length;
      steppers += doc.querySelectorAll('.modal .stepper').length;
      doc.querySelectorAll('.modal input[type=checkbox]').forEach((c) => { if (w.getComputedStyle(c).appearance !== 'none') nativeCount++; });
      doc.querySelectorAll('.modal textarea').forEach((t) => { if (w.getComputedStyle(t).resize !== 'none') nativeCount++; });
      await closeAll();
    }
    nativeCount += doc.querySelectorAll(nativeSel).length;
    console.log('E2E native controls', nativeCount, 'custom selects', selects, 'steppers', steppers);
    if (nativeCount || !selects || !steppers) throw new Error('native control audit failed');
    UI().App.stepDialog('Sample', { mode: 'n', n: 1000, seed: 42 });
    await until(() => doc.querySelector('.modal .select'));
    const modeSel = doc.querySelector('.modal .select');
    let fired = 0;
    modeSel.addEventListener('change', () => fired++);
    modeSel.click();
    await until(() => doc.querySelector('.dd'));
    const opts = doc.querySelectorAll('.dd-i').length;
    doc.querySelectorAll('.dd-i')[1].click();
    await sleep(200);
    console.log('E2E select', 'options', opts, 'value', modeSel.value, 'change events', fired, 'list closed', !doc.querySelector('.dd'));
    if (modeSel.value !== 'percent' || fired !== 1 || doc.querySelector('.dd')) throw new Error('select behaviour failed');
    const step = doc.querySelector('.modal .stepper');
    const stepInput = step.querySelector('input');
    stepInput.value = '12abc';
    stepInput.dispatchEvent(new w.Event('input', { bubbles: true }));
    console.log('E2E stepper sanitised', step.value);
    if (step.value !== '12') throw new Error('stepper sanitising failed');
    await closeAll();
    const tipBtn = doc.getElementById('btn-undo');
    console.log('E2E tooltip source', tipBtn.hasAttribute('title') ? 'native title present' : tipBtn.getAttribute('data-tip'));
    if (tipBtn.hasAttribute('title') || !tipBtn.getAttribute('data-tip')) throw new Error('tooltip migration failed');
    console.log('E2E DONE');
  } catch (e) { console.log('E2E FAIL', e.message, e.stack); }
});
</script></body></html>
